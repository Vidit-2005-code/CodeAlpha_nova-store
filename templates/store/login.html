{% extends "base.html" %}{% block title %}Login | NOVA{% endblock %}
{% block content %}<div class="auth-wrap"><div class="form-panel auth-panel"><p class="eyebrow">WELCOME BACK</p><h1>Login</h1><form method="post" class="stack-form">{% csrf_token %}{% if form.non_field_errors %}<p class="field-error">{{ form.non_field_errors|striptags }}</p>{% endif %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.errors %}<span class="field-error">{{ field.errors|striptags }}</span>{% endif %}</label>{% endfor %}<button class="button full">Login</button></form><p class="auth-switch">New here? <a href="{% url 'register' %}">Create an account</a></p></div></div>{% endblock %}
