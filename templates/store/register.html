{% extends "base.html" %}{% block title %}Create account | NOVA{% endblock %}
{% block content %}<div class="auth-wrap"><div class="form-panel auth-panel"><p class="eyebrow">JOIN NOVA</p><h1>Create your account</h1><form method="post" class="stack-form">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}{% if field.errors %}<span class="field-error">{{ field.errors|striptags }}</span>{% endif %}</label>{% endfor %}<button class="button full">Create account</button></form><p class="auth-switch">Already registered? <a href="{% url 'login' %}">Login</a></p></div></div>{% endblock %}
